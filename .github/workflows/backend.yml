name: Acadence CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:
    inputs:
      integration:
        description: Run isolated database integration tests on a trusted develop/staging commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Non-live fixtures allow production-mode public checks without production secrets.
# Authenticated checks override the database and Redis with isolated services.
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  APP_URL: http://localhost:3000
  AUTH_SECRET: github-ci-disposable-auth-secret-fixture-only
  CRON_SECRET: github-ci-disposable-cron-secret-fixture-only
  DATABASE_URL: postgresql://fixture:fixture@database.example.com/app
  DATABASE_URL_UNPOOLED: postgresql://fixture:fixture@database.example.com/app
  OBJECT_STORAGE_ENDPOINT: https://storage.example.com
  OBJECT_STORAGE_REGION: us-east-2
  OBJECT_STORAGE_BUCKET: fixture
  OBJECT_STORAGE_ACCESS_KEY_ID: fixture-key
  OBJECT_STORAGE_SECRET_ACCESS_KEY: fixture-secret
  UPSTASH_REDIS_REST_URL: https://redis.example.com
  UPSTASH_REDIS_REST_TOKEN: fixture-token
  CACHE_NAMESPACE: test
  APP_ENV: development
  ENVIRONMENT_ISOLATED: 'true'
  NONPRODUCTION_JOBS_ENABLED: 'false'
  OPENAI_API_KEY: ''
  VAPID_PRIVATE_KEY: ''
  BILLING_ENFORCEMENT: 'off'
  RESEND_API_KEY: ''
  EMAIL_FROM: ''
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  TEST_DATABASE_URL: ''
  TEST_DATABASE_ISOLATED: 'false'
  E2E_DATABASE_READY: ''

jobs:
  release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate promotion source and tested release tree
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          case "$BASE:$HEAD_BRANCH" in
            develop:feature/*|develop:fix/*|develop:hotfix/*|develop:main|develop:staging) ;;
            staging:develop|staging:release/*|staging:main|staging:hotfix/*) ;;
            main:staging|main:hotfix/*) ;;
            *) echo "::error::Unsupported promotion. Use feature/fix -> develop -> staging -> main, or hotfix -> main."; exit 1 ;;
          esac
          if [[ "$BASE" != develop && "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Release promotions must originate inside this repository."
            exit 1
          fi
          if [[ "$BASE:$HEAD_BRANCH" == main:staging ]]; then
            git diff --exit-code "$HEAD_SHA" HEAD -- > /dev/null
          fi

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Scan tracked files for credential patterns
        run: node scripts/scan-secrets.mjs
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate route types and typecheck
        run: npm run typecheck
      - name: Translation, analytics and unit tests
        run: npm test
      - name: Validate migration metadata
        run: npx --no-install drizzle-kit check
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Public browser checks
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The Neon driver uses HTTPS/WebSockets; a plain Postgres container is insufficient.
  # Infrastructure credentials are never passed to pull-request code.
  # CI branches are temporary test resources, not permanent application environments.
  database:
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.integration &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UPSTASH_REDIS_REST_URL: ${{ vars.CI_UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.CI_UPSTASH_REDIS_REST_TOKEN }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_TEST_PARENT_BRANCH: ${{ vars.NEON_TEST_PARENT_BRANCH }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate integration credentials
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          for key in NEON_API_KEY UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing isolated CI service configuration: $key"
              exit 1
            fi
          done
          if [[ -z "$NEON_PROJECT_ID" || -z "$NEON_TEST_PARENT_BRANCH" ]]; then
            echo "::error::Configure an empty parent in an isolated nonproduction Neon project."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Set branch expiry
        id: expiry
        run: echo "expires_at=$(date -u -d '+1 day' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Create disposable Neon branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        id: branch
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: ${{ vars.NEON_TEST_PARENT_BRANCH }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          branch_type: schema-only
          expires_at: ${{ steps.expiry.outputs.expires_at }}
      - name: Apply migrations to disposable branch
        run: node scripts/run-environment.mjs development migrate --process-env
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
      - name: Database integration tests
        run: npm run test:unit
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
          TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          TEST_DATABASE_ISOLATED: 'true'
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Authenticated browser checks
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
          E2E_DATABASE_READY: '1'
          PLAYWRIGHT_SKIP_BUILD: '1'
      - name: Delete disposable Neon branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        if: always() && steps.branch.outputs.branch_id != ''
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: database-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore

  required-ci:
    name: required-ci
    if: always()
    needs: [release-policy, security, quality, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          POLICY_RESULT: ${{ needs.release-policy.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          [[ "$POLICY_RESULT" == success && "$SECURITY_RESULT" == success && "$QUALITY_RESULT" == success ]]
          [[ "$DATABASE_RESULT" == success || "$DATABASE_RESULT" == skipped ]]
